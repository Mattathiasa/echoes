services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echoes
      POSTGRES_PASSWORD: echoes
      POSTGRES_DB: echoes
    ports:
      - "5432:5432"
    volumes:
      - echoes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  echoes_pgdata:
